<app-icon-defs />

<div class="wallpaper" aria-hidden="true"></div>

<app-desktop />

<header class="menubar">
  <strong class="mb-app">{{ activeName() }}</strong>
  <span class="spacer"></span>
  <button
    type="button"
    class="mb-volume"
    [attr.aria-pressed]="sound.muted()"
    [attr.aria-label]="sound.muted() ? 'Unmute sound' : 'Mute sound'"
    [title]="sound.muted() ? 'Sound off' : 'Sound on'"
    (click)="sound.toggle()"
  >
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path d="M2 6h3l4-3.5v11L5 10H2z" fill="currentColor" />
      @if (sound.muted()) {
        <path d="M11 6l4 4m0-4l-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      } @else {
        <path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6.3 6.3 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      }
    </svg>
  </button>
  <time class="mb-clock" [attr.datetime]="now().toISOString()">{{ now() | date: 'EEE h:mm a' }}</time>
</header>

<main class="workspace">
  <router-outlet />
</main>

<nav class="dock" aria-label="Dock">
  <ul>
    @for (item of dockItems(); track item.id) {
      <li>
        <a
          [routerLink]="'/' + item.path"
          [class.active]="activeRoot() === item.path"
          [attr.data-label]="item.name"
          [attr.aria-label]="item.name"
        >
          <app-node-icon [icon]="item.icon" />
        </a>
      </li>
    }
  </ul>
</nav>
