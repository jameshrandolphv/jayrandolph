<app-icon-defs />

<div class="wallpaper" aria-hidden="true"></div>

<header class="menubar">
  <strong class="mb-app">{{ activeName() }}</strong>
  <span class="spacer"></span>
  <time class="mb-clock" [attr.datetime]="now().toISOString()">{{ now() | date: 'EEE h:mm a' }}</time>
</header>

<main class="workspace">
  <router-outlet />
</main>

<nav class="dock" aria-label="Dock">
  <ul>
    @for (item of dockItems(); track item.id) {
      <li>
        <a
          [routerLink]="'/' + item.path"
          [class.active]="activeRoot() === item.path"
          [attr.data-label]="item.name"
          [attr.aria-label]="item.name"
        >
          <app-node-icon [icon]="item.icon" />
        </a>
      </li>
    }
  </ul>
</nav>
