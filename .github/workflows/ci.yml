name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Angular CLI needs Node 22.22.3 or newer.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
